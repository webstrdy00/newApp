services:
  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://haemeoknote:haemeoknote@db:5432/haemeoknote}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-haemeoknote}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-["*"]}
      API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:-http://localhost:8000/api}
    ports:
      - "8000:8000"
    depends_on:
      - db
      - minio
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-haemeoknote}
      POSTGRES_USER: ${POSTGRES_USER:-haemeoknote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-haemeoknote}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  adminer:
    image: adminer:5
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  postgres_data:
  minio_data:
