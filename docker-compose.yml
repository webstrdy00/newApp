services:
  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-haemeoknote}:${POSTGRES_PASSWORD:-haemeoknote}@db:5432/${POSTGRES_DB:-haemeoknote}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-haemeoknote}
      MINIO_SECURE: "false"
      IMAGE_UPLOAD_MAX_BYTES: ${IMAGE_UPLOAD_MAX_BYTES:-10485760}
      IMAGE_UPLOAD_ALLOWED_CONTENT_TYPES: ${IMAGE_UPLOAD_ALLOWED_CONTENT_TYPES:-["image/jpeg","image/png","image/webp"]}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production-with-strong-secret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-["*"]}
      API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:-http://localhost:8000/api}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      - db
      - minio
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-haemeoknote}
      POSTGRES_USER: ${POSTGRES_USER:-haemeoknote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-haemeoknote}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  adminer:
    image: adminer:5
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      - db

volumes:
  postgres_data:
  minio_data:
